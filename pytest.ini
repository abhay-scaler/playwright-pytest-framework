[pytest]
# The framework's own suite. Every marker these tests use is registered by the
# plugin itself (pwpf/plugin.py), which is why --strict-markers passes here with
# no `markers` section: a consumer gets the same, and a declaration here would
# only let the two drift.
#
# Deliberately minimal next to a consumer's ini. No --html (that needs the
# `report` extra, and tests/test_report_path.py pins the path logic without
# one), no --alluredir (nothing here asserts on Allure output), no reruns and
# no -n auto: a framework test that needs retrying to pass is a framework test
# that is lying.
addopts = -ra --strict-markers -p no:pytest_playwright
testpaths = tests
