[pytest]
addopts = -ra --strict-markers -p no:pytest_playwright --html=reports/pytest_report.html --self-contained-html --reruns 1 --reruns-delay 1 --alluredir=reports/allure-results
testpaths = tests
markers =
    smoke: quick smoke tests
    ui: browser UI tests
    regression: regression coverage
    api: API-oriented tests
    app(name): application under test, auto-applied by conftest.py based on test path
    production: drives a live third-party production site; excluded from every CI run, opt in locally with -m production
    scenario(id): catalog scenario this test implements, e.g. scenario("MNY-HOME-001"); also attached as an Allure label
    quarantined: known-unstable test, excluded from the blocking CI gates and run in a separate non-blocking job; see DESIGN.md section 8
