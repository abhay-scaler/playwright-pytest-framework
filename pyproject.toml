[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-pytest-framework"
version = "0.1.0"
description = "An application-neutral Playwright + pytest framework: browser lifecycle, per-application configuration, failure artifacts, and an AI test-engineering toolkit."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abhay Ranjan" }]
requires-python = ">=3.12"
keywords = ["pytest", "playwright", "testing", "framework", "pytest-plugin"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

# What the plugin itself imports: pytest, playwright and allure-pytest, plus
# pytest-rerunfailures because the plugin applies `flaky` when an application's
# config sets retry_count - with --strict-markers an unregistered marker is an
# error, so a consumer cannot be left to discover that dependency by failing.
# Nothing else in pwpf/ imports a third party (verified by grep over the package).
dependencies = [
    "pytest>=8.0.0",
    "playwright>=1.48.0",
    "allure-pytest>=2.0.0",
    "pytest-rerunfailures>=14.0.0",
]

[project.optional-dependencies]
# The scenario-catalog validator's own dependencies, kept out of the core
# install so a project that only wants the fixtures does not pull a YAML parser
# and a JSON Schema implementation. Mirrors requirements-ai.in.
ai = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]
# What this repository uses to develop and check the framework; mirrors
# requirements.in. Not needed to *use* the framework.
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest-html>=4.0.0",
    "pytest-xdist>=3.0.0",
]

# Installing the distribution is all a consumer needs: pytest discovers the
# plugin through this entry point, so the fixtures, markers and artifact
# handling arrive without a conftest.py.
#
# The entry point is named after the module on purpose. pytest skips importing
# a plugin whose *name* is already registered, but pluggy refuses the same
# module object under a second name - so an entry point called `pwpf` plus this
# repository's `pytest_plugins = ["pwpf.plugin"]` would abort the session with
# "Plugin already registered under a different name" in any environment where
# the distribution is installed. Matching the two names makes the second load a
# no-op instead.
[project.entry-points.pytest11]
"pwpf.plugin" = "pwpf.plugin"

[project.scripts]
pwpf-validate-catalog = "pwpf.ai_testing.validate_catalog:main"

[tool.setuptools.packages.find]
# Only the framework ships. apps/, tests/, docs/ and ai_testing/ (the prompt
# library, which is repository documentation) are deliberately excluded.
include = ["pwpf*"]

[tool.setuptools.package-data]
# Framework-owned data that must survive installation. Consumer-owned catalogs
# and application configuration are never packaged - they live in the project
# being tested.
"pwpf.ai_testing" = ["schemas/*.json"]

[tool.black]
line-length = 100
include = '\.pyi?$'

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# Deliberately not "strict" yet - the goal of this initial rollout is to
# actually check the type hints that already exist, incrementally, not to
# retrofit exhaustive typing across the codebase in one pass. Tighten
# (disallow_untyped_defs, etc.) module by module as coverage grows.
python_version = "3.12"
explicit_package_bases = true
# A wheel build leaves a copy of the package under build/; mypy does not read
# .gitignore, so without this it type-checks every module twice.
exclude = "^(build|dist)/"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# PyYAML and jsonschema are the scenario-catalog validator's own dependencies and live
# in requirements-ai.txt, not the test-runtime lock - so the CI lint job type-checks
# without them installed, and PyYAML ships no inline types in any case. The validator
# imports both lazily, inside the functions that need them, so the rest of the module
# (and `--help`) works without them.
[[tool.mypy.overrides]]
module = ["yaml", "jsonschema"]
ignore_missing_imports = true
