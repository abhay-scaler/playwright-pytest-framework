<!doctype html>
<!--
  Local stand-in for a server-rendered page whose controls only become
  interactive once the client bundle hydrates - the defect this app's HomePage
  had to be taught to wait for. Nothing here talks to the network, so the
  regression tests that use it stay deterministic and do not depend on a third
  party being up.

  The hash chooses the behaviour:
    #hydrate=0      hydrate immediately
    #hydrate=800    attach the handler after 800ms (the race)
    #hydrate=never  never hydrate (the page object must fail loudly)

  The button toggles the modal, exactly as Algolia DocSearch does, so a second
  blind click would close what the first one opened. data-clicks counts every
  click that reaches the button, whether or not a handler is attached, which is
  how a test can prove the page object clicked exactly once.
-->
<html lang="en" data-has-hydrated="false">
  <head>
    <meta charset="utf-8" />
    <title>Hydration fixture</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; }
      .DocSearch-Modal[hidden] { display: none; }
      .DocSearch-Modal { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <button type="button" class="DocSearch DocSearch-Button" aria-label="Search" data-clicks="0">
      <span class="DocSearch-Button-Placeholder">Search</span>
    </button>

    <div class="DocSearch-Modal" hidden>
      <input class="DocSearch-Input" type="search" placeholder="Search docs" />
      <div class="DocSearch-Hits">Results</div>
    </div>

    <script>
      const button = document.querySelector(".DocSearch-Button");
      const modal = document.querySelector(".DocSearch-Modal");

      // Capture phase, attached immediately: counts clicks that land on the
      // button even while the page is "not hydrated" and nothing happens.
      button.addEventListener(
        "click",
        () => {
          button.dataset.clicks = String(Number(button.dataset.clicks) + 1);
        },
        true
      );

      const mode = new URLSearchParams(location.hash.slice(1)).get("hydrate") ?? "0";
      if (mode !== "never") {
        window.setTimeout(() => {
          button.addEventListener("click", () => {
            modal.hidden = !modal.hidden;
          });
          document.documentElement.dataset.hasHydrated = "true";
        }, Number(mode));
      }
    </script>
  </body>
</html>
