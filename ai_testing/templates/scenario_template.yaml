# Scenario catalog template.
#
# WHAT THIS IS: a documentation and traceability artifact. Nothing in the framework reads this
# file. There is no scenario interpreter, and PR 1 deliberately does not add one - scenarios are
# a design record that a human approves, and the executable truth is always the Pytest test named
# under `automation.test`.
#
# VALIDATION: `python -m ai_testing.validate_catalog` checks every committed catalog against
# ai_testing/schemas/scenario.schema.json plus the lifecycle rules in
# docs/ai-testing/scenario-authoring.md. Unknown keys are rejected, so a misspelling fails
# rather than being silently ignored. This template is not itself a catalog file and is not
# validated: it lives outside apps/*/scenarios/ and its examples would not pass the
# lifecycle rules unchanged.
#
# EVERY VALUE BELOW IS ILLUSTRATIVE. The two scenarios are worked examples showing the shape and
# the labelling, not verified Myntra behaviour: `[A]` marks an assumption and `[?]` an open
# question, exactly as in `ai_testing/README.md` § House rules. Do not copy an expected result
# from here into a real catalog.
#
# WHERE IT LIVES: `apps/<app>/scenarios/<feature>.yaml`, so an application stays
# self-contained (DESIGN.md §1). A committed example:
# apps/myntra/scenarios/shopping_journey.yaml.

meta:
  app: myntra                                  # must match an existing apps/<app>/ package
  feature: shopping_journey
  brief: artifacts/ai-work/20261024-shopping-journey/feature-brief.md
  owner: "<name or team that owns these expectations>"
  updated: "2026-10-24"
  id_scheme: "MNY-<AREA>-<NNN>"                # app prefix, functional area, zero-padded counter

scenarios:
  - id: MNY-SRCH-001                           # stable forever; never renumber, never reuse
    title: A product search returns results matching the search term
    feature: shopping_journey
    priority: P1                               # P0 blocks a release, P1 high, P2 medium, P3 low
    risk: high                                 # business impact if this breaks, not test difficulty
    status: DRAFT                              # see docs/ai-testing/scenario-authoring.md
    requirement: FB-SHOP-01                    # a heading in the feature brief, or a ticket id
    preconditions:
      - The homepage is reachable and renders its header search bar
    test_data:
      search_term: "running shoes"             # [A] a term assumed to always have results
      source: inline constant                  # inline | apps/<app>/testdata/<file> | factory
    steps:
      - Open the homepage
      - Enter the search term in the header search bar
      - Submit the search
    expected_results:
      - The results page shows at least one product                      # [A] needs brief sign-off
      - Each visible product's title or brand contains the search term   # [?] exact rule unknown
    environment:
      target: live-production                  # local-fixture | sanctioned-practice | live-production
      side_effects: none                       # none | session-state | server-state (describe)
      authorization_required: true             # true for any live-production target
      ci_eligible: false                       # live third-party site: never a CI gate
    automation:
      test: null                               # e.g. tests/myntra/ui/test_search.py::test_search_returns_matching_products
      markers: [ui, production]                # must include `production` when target is live-production
      implemented: false
    evidence:
      locators: artifacts/ai-work/20261024-shopping-journey/locator-evidence.md
      exploration: artifacts/ai-work/20261024-shopping-journey/action-map.md
    review:
      status_history:
        - status: DRAFT
          by: assistant
          date: "2026-10-24"
          note: Generated from the feature brief; expectations not yet confirmed by a human.
      blocking_questions:
        - "Is a zero-result search for a valid term a defect or acceptable? [?]"

  - id: MNY-BAG-001
    title: A product added to the bag appears in the bag with the selected size
    feature: shopping_journey
    priority: P1
    risk: high
    status: NEEDS_CLARIFICATION
    requirement: FB-SHOP-04
    preconditions:
      - A product detail page is open for an in-stock product
      - At least one size is selectable
    test_data:
      product: resolved at runtime from search results   # never a hard-coded product id: inventory changes
      size: first available
    steps:
      - Select an available size
      - Add the product to the bag
      - Open the bag
    expected_results:
      - The bag contains exactly the product that was added, with the selected size   # [A]
    environment:
      target: live-production
      side_effects: session-state              # adding to a bag mutates the session; cleanup needed
      authorization_required: true
      ci_eligible: false
    automation:
      test: null
      markers: [ui, production]
      implemented: false
    evidence:
      locators: null
      exploration: null
    review:
      status_history:
        - status: DRAFT
          by: assistant
          date: "2026-10-24"
        - status: NEEDS_CLARIFICATION
          by: "<reviewer>"
          date: "2026-10-24"
          note: Side effects on a live site need explicit authorization and a cleanup decision.
      blocking_questions:
        - "Is mutating bag state on the live site authorized, and how is it cleaned up? [?]"
        - "Does the pilot need a sanctioned target for this instead? [?]"
