name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Nightly full regression + cross-browser sweep, 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      cross_browser:
        description: "Also run the cross-browser (Firefox/WebKit) suite"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Runs on every trigger. Fast, no browser needed - fails fast before any
  # job pays for a Playwright install.
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: mypy
        run: mypy .

  # Scenario catalog + traceability. Its own job because it is the only thing
  # that needs requirements-ai.txt (PyYAML + jsonschema): installing those in
  # the test jobs would put them in every browser job's dependency path for no
  # reason. Static analysis only - no pytest, no browser, no network - so it
  # needs no Playwright install and runs in seconds.
  scenario-catalog:
    name: Scenario Catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - name: Install validation dependencies
        run: pip install -r requirements-ai.txt
      - name: Validate scenario catalogs and test mappings
        run: python -m ai_testing.validate_catalog

  # PR gate. Deliberately narrow: framework self-tests (fast, no browser) +
  # the smoke suite (Chromium only). Keeps PR feedback quick; full coverage
  # runs on merge and nightly instead.
  pr-smoke:
    name: PR Smoke (Chromium)
    if: github.event_name == 'pull_request'
    needs: lint-and-type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve pinned Playwright version
        id: playwright-version
        run: echo "version=$(grep -oP '(?<=^playwright==)[0-9.]+' requirements.txt)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keying on the exact pinned Playwright version means a version
          # bump always misses the cache and installs fresh - a stale cache
          # can never be reused for an incompatible browser build.
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (Chromium)
        run: python -m playwright install --with-deps chromium
      - name: Framework self-tests
        env:
          CI: true
          HEADLESS: true
          ENVIRONMENT: ci
        # Every blocking pytest invocation in this workflow carries -m "not production
        # and not quarantined". `production` tests drive a live third-party site and are
        # local-only by policy; `quarantined` tests are known-unstable and run in the
        # non-blocking job at the end of this file instead of gating anything. Neither
        # marker enforces anything by itself - these commands do, and
        # tests/test_ci_production_exclusion.py and tests/test_quarantine_policy.py fail
        # if an invocation loses either exclusion.
        run: pytest tests/test_*.py -m "not production and not quarantined" --junitxml=reports/junit-framework.xml
      - name: Smoke suite
        env:
          CI: true
          HEADLESS: true
          ENVIRONMENT: ci
        run: pytest -m "smoke and not production and not quarantined" -n auto --junitxml=reports/junit-smoke.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-artifacts-pr-smoke
          path: |
            reports/
            screenshots/
            traces/
            videos/
          if-no-files-found: ignore

  # Full suite, Chromium, on merge to main/dev, nightly, and manual dispatch.
  regression:
    name: Regression Suite (Chromium)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: lint-and-type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve pinned Playwright version
        id: playwright-version
        run: echo "version=$(grep -oP '(?<=^playwright==)[0-9.]+' requirements.txt)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (Chromium)
        run: python -m playwright install --with-deps chromium
      - name: Run full suite
        env:
          CI: true
          HEADLESS: true
          ENVIRONMENT: ci
        # Sharded naturally by application today (tests/<app>/...); the same
        # apps/<app> boundary this framework already uses is what a future
        # CI matrix would shard on, without any new tooling.
        run: pytest -m "not production and not quarantined" -n auto --junitxml=reports/junit.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-artifacts-regression
          path: |
            reports/
            screenshots/
            traces/
            videos/
          if-no-files-found: ignore

  # Firefox + WebKit, full suite. Nightly by default, or on-demand via
  # workflow_dispatch - never on every PR, since it roughly triples runtime
  # for coverage most changes don't need.
  cross-browser:
    name: Cross-Browser Regression
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cross_browser)
    needs: lint-and-type-check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve pinned Playwright version
        id: playwright-version
        run: echo "version=$(grep -oP '(?<=^playwright==)[0-9.]+' requirements.txt)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (${{ matrix.browser }})
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run full suite
        env:
          CI: true
          HEADLESS: true
          ENVIRONMENT: ci
          BROWSER: ${{ matrix.browser }}
        run: pytest -m "not production and not quarantined" -n auto --junitxml=reports/junit-${{ matrix.browser }}.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-artifacts-cross-browser-${{ matrix.browser }}
          path: |
            reports/
            screenshots/
            traces/
            videos/
          if-no-files-found: ignore

  # Known-unstable tests, run so their outcome stays visible without gating
  # anything: continue-on-error means a failure here never fails the workflow.
  # Quarantine is a holding state with an exit criterion, not a bin - what is in
  # it, why, and what must happen before it returns to the gates above is in
  # DESIGN.md section 8, and tests/test_quarantine_policy.py fails if the set of
  # quarantined tests changes without that record being updated.
  quarantine:
    name: Quarantined (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve pinned Playwright version
        id: playwright-version
        run: echo "version=$(grep -oP '(?<=^playwright==)[0-9.]+' requirements.txt)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser (Chromium)
        run: python -m playwright install --with-deps chromium
      - name: Quarantined suite
        env:
          CI: true
          HEADLESS: true
          ENVIRONMENT: ci
        # Still excludes `production`: quarantine does not relax the live-site
        # policy, and this job is not a way to run live-site tests in CI.
        run: pytest -m "quarantined and not production" -n auto --junitxml=reports/junit-quarantine.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-artifacts-quarantine
          path: |
            reports/
            screenshots/
            traces/
            videos/
          if-no-files-found: ignore
